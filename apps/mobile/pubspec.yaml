name: mobile
description: "Production-oriented Flutter Starter Application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Architecture Shared Packages
  app_core:
    path: ../../packages/app_core
  app_network:
    path: ../../packages/app_network
  app_storage:
    path: ../../packages/app_storage
  design_system:
    path: ../../packages/design_system

  # Routing
  kaisel: ^1.1.0

  # State Management
  bloc_signals: ^1.0.1
  bloc_signals_flutter: ^1.2.0
  bloc_signals_hydrate: ^1.0.1

  # Models & DI
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  injectable: ^3.0.0

  # Networking & Utils
  dio: ^5.11.0
  logger: ^2.7.0
  toastification: ^3.2.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  app_lints:
    path: ../../packages/app_lints
  build_runner: ^2.16.0
  freezed: ^4.0.0
  injectable_generator: ^3.1.3

flutter:
  uses-material-design: true
