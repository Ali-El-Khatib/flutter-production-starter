name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  validate:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true

      - name: Resolve Workspace Dependencies
        run: flutter pub get --enforce-lockfile

      - name: Bootstrap Melos Workspace
        run: dart run melos bootstrap --enforce-lockfile

      - name: Generate Source Files
        run: dart run melos run generate

      - name: Verify Generated Files Are Current
        run: git diff --exit-code

      - name: Check Code Formatting
        run: dart run melos run format:check

      - name: Analyze Workspace
        run: dart run melos run analyze

      - name: Run Tests
        run: dart run melos run test

      - name: Generate Mobile Coverage
        run: dart run melos run coverage:mobile

      - name: Enforce Mobile Coverage Floor
        run: dart run melos run coverage:check

      - name: Upload Mobile Coverage
        uses: actions/upload-artifact@v7
        with:
          name: mobile-coverage
          path: apps/mobile/coverage/lcov.info
          if-no-files-found: error

      - name: Build Production Entry Point
        working-directory: apps/mobile
        run: flutter build apk --release --target lib/main_production.dart
