name: flutter_starter

packages:
  - apps/**
  - packages/**

command:
  bootstrap:
    usePubspecOverrides: true

scripts:
  format:
    run: dart format .
    description: "Format all Dart files in workspace"

  format:check:
    run: dart format --output=none --set-exit-if-changed .
    description: "Check formatting across workspace"

  analyze:
    run: melos exec -- flutter analyze
    description: "Analyze all packages"

  test:
    run: melos exec --dir-exists="test" -- flutter test
    description: "Run tests in all packages"

  generate:
    run: melos exec --depends-on=build_runner -- dart run build_runner build --delete-conflicting-outputs
    description: "Run build_runner code generation"

  clean:
    run: melos exec -- flutter clean
    description: "Clean build artifacts in all packages"

  # App Run Scripts
  run:dev:
    run: melos exec --scope="mobile" -- flutter run -t lib/main_development.dart
    description: "Run mobile app in development mode"

  run:staging:
    run: melos exec --scope="mobile" -- flutter run -t lib/main_staging.dart
    description: "Run mobile app in staging mode"

  run:prod:
    run: melos exec --scope="mobile" -- flutter run -t lib/main_production.dart
    description: "Run mobile app in production mode"

  run:emulator:
    run: melos exec --scope="mobile" -- flutter run -d emulator-5554 -t lib/main_development.dart
    description: "Run mobile app directly on active emulator"

  devices:
    run: flutter devices
    description: "List all connected devices"

  emulators:
    run: flutter emulators
    description: "List all available emulators"

  emulators:launch:
    run: flutter emulators --launch Pixel_7_API_34
    description: "Launch Pixel 7 emulator"
