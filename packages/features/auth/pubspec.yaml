name: feature_auth
description: Authentication feature implementation (Clean Architecture with BLoC Signals, Dio, and Secure Storage).
version: 0.0.1
publish_to: 'none'

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.0.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  # Shared Packages & Contracts
  auth_contract: ^0.0.1
  app_core: ^0.0.1
  app_network: ^0.0.1
  app_storage: ^0.0.1
  design_system: ^0.0.1

  # State Management & Signals
  bloc_signals: ^1.0.1
  bloc_signals_flutter: ^1.2.0

  # Dependency Injection
  get_it: ^9.2.1
  injectable: ^3.0.0

  # Models & JSON
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  app_lints: ^0.0.1
  build_runner: ^2.4.15
  freezed: ^3.2.3
  json_serializable: ^6.9.4
  injectable_generator: ^3.0.0
